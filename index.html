<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>고등 중국어 단원별 애니팡</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      background: #111827;
      color: #FFFFFF;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .game-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .lesson-selector-box {
      width: 100%;
      margin-bottom: 10px;
    }
    .lesson-select {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      background: #374151;
      color: #FBBF24;
      border: 2px solid #4F46E5;
      border-radius: 12px;
      outline: none;
      cursor: pointer;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1F2937;
      padding: 12px 20px;
      border-radius: 16px;
      margin-bottom: 12px;
      border: 1px solid #374151;
    }
    .stat-box { text-align: center; }
    .stat-title { font-size: 12px; color: #9CA3AF; margin-bottom: 2px; }
    .stat-value { font-size: 22px; font-weight: 800; color: #F59E0B; }

    .card-banner {
      width: 100%;
      height: 64px;
      background: #374151;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
      border: 2px solid #6366F1;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }
    .banner-hanzi { font-size: 24px; font-weight: 800; color: #60A5FA; }
    .banner-pinyin { font-size: 15px; color: #34D399; font-weight: 600; }
    .banner-meaning { font-size: 14px; color: #FBBF24; font-weight: 700; }

    .grid-board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: #1F2937;
      padding: 8px;
      border-radius: 20px;
      border: 2px solid #374151;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .tile {
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25);
    }
    .tile:active { transform: scale(0.92); }
    .tile.selected {
      outline: 4px solid #FFFFFF;
      transform: scale(1.06);
      z-index: 10;
      box-shadow: 0 0 15px #FFFFFF;
    }
    .tile-hanzi { font-size: 16px; line-height: 1.1; margin-bottom: 2px; }
    .tile-pinyin { font-size: 9px; opacity: 0.9; font-weight: normal; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #1F2937;
      padding: 32px 24px;
      border-radius: 24px;
      text-align: center;
      width: 88%;
      max-width: 340px;
      border: 2px solid #6366F1;
    }
    .modal-title { font-size: 26px; font-weight: 800; color: #F59E0B; margin-bottom: 12px; }
    .modal-score { font-size: 18px; margin-bottom: 24px; color: #E5E7EB; }
    .btn-action {
      background: #4F46E5;
      color: white;
      border: none;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
    .btn-action:active { transform: scale(0.96); background: #4338CA; }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="lesson-selector-box">
      <select id="lessonSelect" class="lesson-select" onchange="changeLesson()">
        <option value="1단원-회화1">📖 1단원 회화 1</option>
        <option value="1단원-회화2">📖 1단원 회화 2</option>
        <option value="1단원-추가">➕ 1단원 추가 단어</option>
        <option value="2단원-회화1">📖 2단원 회화 1</option>
        <option value="2단원-회화2">📖 2단원 회화 2</option>
        <option value="2단원-추가">➕ 2단원 추가 단어</option>
        <option value="전체">📚 1~2단원 전체 통합</option>
      </select>
    </div>

    <div class="header">
      <div class="stat-box">
        <div class="stat-title">남은 시간</div>
        <div id="timer" class="stat-value">60s</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">현재 점수</div>
        <div id="score" class="stat-value">0</div>
      </div>
    </div>

    <div class="card-banner">
      <div id="bannerHanzi" class="banner-hanzi">중국어</div>
      <div id="bannerPinyin" class="banner-pinyin">Anipang</div>
      <div id="bannerMeaning" class="banner-meaning">3개를 맞추세요!</div>
    </div>

    <div id="board" class="grid-board"></div>
  </div>

  <div id="gameOverModal" class="modal">
    <div class="modal-box">
      <div class="modal-title">🎉 시간 종료!</div>
      <div id="finalScore" class="modal-score">최종 점수: 0점</div>
      <button class="btn-action" onclick="resetGame()">다시 도전하기 🚀</button>
    </div>
  </div>

  <script>
    // 단원별 단어 데이터 구역 (수정 가능)
    const LESSON_DATA = {

        { hanzi: "暑假", pinyin: "shǔjià", meaning: "여름 방학" },
        { hanzi: "过", pinyin: "guò", meaning: "지내다" },
        { hanzi: "得", pinyin: "de", meaning: "정도 연결" },
        { hanzi: "怎么样", pinyin: "zěnmeyàng", meaning: "어떠하다" },
        { hanzi: "每", pinyin: "měi", meaning: "매, ~마다" },
        { hanzi: "天", pinyin: "tiān", meaning: "날, 일" },
        { hanzi: "看", pinyin: "kàn", meaning: "보다" },
        { hanzi: "书", pinyin: "shū", meaning: "책" },
        { hanzi: "运动", pinyin: "yùndòng", meaning: "운동하다" },
        { hanzi: "非常", pinyin: "fēicháng", meaning: "매우, 대단히" }
      ],
      "1단원-회화2": [
        { hanzi: "到", pinyin: "dào", meaning: "도달하다" },
        { hanzi: "同学", pinyin: "tóngxué", meaning: "학우" },
        { hanzi: "真", pinyin: "zhēn", meaning: "정말로" },
        { hanzi: "高兴", pinyin: "gāoxìng", meaning: "기쁘다" },
        { hanzi: "觉得", pinyin: "juéde", meaning: "~라고 느끼다" },
        { hanzi: "学期", pinyin: "xuéqī", meaning: "학기" },
        { hanzi: "努力", pinyin: "nǔlì", meaning: "열심히" },
        { hanzi: "学习", pinyin: "xuéxí", meaning: "공부하다" },
        { hanzi: "一起", pinyin: "yìqǐ", meaning: "함께" },
        { hanzi: "加油", pinyin: "jiāyóu", meaning: "힘을 내다" }
      ],
      "1단원-추가": [
        { hanzi: "熊猫", pinyin: "xióngmāo", meaning: "판다" },
        { hanzi: "吃", pinyin: "chī", meaning: "먹다" },
        { hanzi: "多", pinyin: "duō", meaning: "많다" },
        { hanzi: "玩儿", pinyin: "wánr", meaning: "놀다" },
        { hanzi: "开心", pinyin: "kāixīn", meaning: "즐겁다" },
        { hanzi: "收", pinyin: "shōu", meaning: "받다" },
        { hanzi: "个", pinyin: "ge", meaning: "개 (단위)" },
        { hanzi: "礼物", pinyin: "lǐwù", meaning: "선물" },
        { hanzi: "相信", pinyin: "xiāngxìn", meaning: "믿다" },
        { hanzi: "能", pinyin: "néng", meaning: "~할 수 있다" },
        { hanzi: "做", pinyin: "zuò", meaning: "하다" },
        { hanzi: "昨天", pinyin: "zuótiān", meaning: "어제" },
        { hanzi: "没", pinyin: "méi", meaning: "~않다" },
        { hanzi: "不错", pinyin: "búcuò", meaning: "좋다" },
        { hanzi: "还", pinyin: "hái", meaning: "그런대로" },
        { hanzi: "行", pinyin: "xíng", meaning: "괜찮다" },
        { hanzi: "不怎么样", pinyin: "bù zěnmeyàng", meaning: "별로 좋지 않다" },
        { hanzi: "有意思", pinyin: "yǒu yìsi", meaning: "재미있다" },
        { hanzi: "紧张", pinyin: "jǐnzhāng", meaning: "긴장하다" },
        { hanzi: "太", pinyin: "tài", meaning: "너무" },
        { hanzi: "可惜", pinyin: "kěxī", meaning: "아깝다" }
      ],
      "2단원-회화1": [
        { hanzi: "想", pinyin: "xiǎng", meaning: "~하고 싶다" },
        { hanzi: "参加", pinyin: "cānjiā", meaning: "참가하다" },
        { hanzi: "什么", pinyin: "shénme", meaning: "무슨, 무엇" },
        { hanzi: "社团", pinyin: "shètuán", meaning: "동아리" },
        { hanzi: "电影", pinyin: "diànyǐng", meaning: "영화" },
        { hanzi: "呢", pinyin: "ne", meaning: "~는요" },
        { hanzi: "音乐", pinyin: "yīnyuè", meaning: "음악" },
        { hanzi: "喜欢", pinyin: "xǐhuan", meaning: "좋아하다" },
        { hanzi: "弹", pinyin: "tán", meaning: "연주하다" },
        { hanzi: "钢琴", pinyin: "gāngqín", meaning: "피아노" },
        { hanzi: "报名", pinyin: "bàomíng", meaning: "신청하다" }
      ],
      "2단원-회화2": [
        { hanzi: "欢迎", pinyin: "huānyíng", meaning: "환영하다" },
        { hanzi: "条件", pinyin: "tiáojiàn", meaning: "조건" },
        { hanzi: "只要", pinyin: "zhǐyào", meaning: "~하기만 하면" },
        { hanzi: "快", pinyin: "kuài", meaning: "빨리" },
        { hanzi: "时间", pinyin: "shíjiān", meaning: "시간" },
        { hanzi: "从", pinyin: "cóng", meaning: "~부터" },
        { hanzi: "到", pinyin: "dào", meaning: "~까지" },
        { hanzi: "联系", pinyin: "liánxì", meaning: "연락하다" },
        { hanzi: "方式", pinyin: "fāngshì", meaning: "방식" },
        { hanzi: "加入", pinyin: "jiārù", meaning: "가입하다" },
        { hanzi: "生活", pinyin: "shēnghuó", meaning: "생활" },
        { hanzi: "会", pinyin: "huì", meaning: "~할 것이다" },
        { hanzi: "更", pinyin: "gèng", meaning: "더욱" },
        { hanzi: "精彩", pinyin: "jīngcǎi", meaning: "근사하다" }
      ],
      "2단원-추가": [
        { hanzi: "周末", pinyin: "zhōumò", meaning: "주말" },
        { hanzi: "韩国", pinyin: "Hánguó", meaning: "한국" },
        { hanzi: "足球", pinyin: "zúqiú", meaning: "축구" },
        { hanzi: "比赛", pinyin: "bǐsài", meaning: "경기" },
        { hanzi: "有", pinyin: "yǒu", meaning: "있다" },
        { hanzi: "打", pinyin: "dǎ", meaning: "치다" },
        { hanzi: "篮球", pinyin: "lánqiú", meaning: "농구" },
        { hanzi: "愿意", pinyin: "yuànyì", meaning: "원하다" },
        { hanzi: "可以", pinyin: "kěyǐ", meaning: "~해도 된다" },
        { hanzi: "科学", pinyin: "kēxué", meaning: "과학" },
        { hanzi: "实验", pinyin: "shíyàn", meaning: "실험" },
        { hanzi: "动漫", pinyin: "dòngmàn", meaning: "애니메이션" },
        { hanzi: "画", pinyin: "huà", meaning: "그리다" },
        { hanzi: "画儿", pinyin: "huàr", meaning: "그림" },
        { hanzi: "体育", pinyin: "tǐyù", meaning: "체육" },
        { hanzi: "乒乓球", pinyin: "pīngpāngqiú", meaning: "탁구" },
        { hanzi: "努力", pinyin: "nǔlì", meaning: "노력하다" },
        { hanzi: "成功", pinyin: "chénggōng", meaning: "성공하다" },
        { hanzi: "问题", pinyin: "wèntí", meaning: "질문, 문제" },
        { hanzi: "找", pinyin: "zhǎo", meaning: "찾다" },
        { hanzi: "天气", pinyin: "tiānqì", meaning: "날씨" },
        { hanzi: "出去", pinyin: "chūqu", meaning: "나가다" },
        { hanzi: "拍照", pinyin: "pāizhào", meaning: "사진을 찍다" }
      ]
    };

    const TILE_COLORS = ["#EF4444", "#10B981", "#F59E0B", "#3B82F6", "#8B5CF6", "#EC4899", "#06B6D4", "#84CC16"];
    const BOARD_SIZE = 6;
    let currentWords = [];
    let board = [];
    let selectedTile = null;
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let isProcessing = false;

    function loadWordList() {
      const selectedKey = document.getElementById('lessonSelect').value;
      let rawList = [];

      if (selectedKey === "전체") {
        Object.values(LESSON_DATA).forEach(list => rawList.push(...list));
      } else {
        rawList = LESSON_DATA[selectedKey] || [];
      }

      currentWords = rawList.map((item, idx) => ({
        ...item,
        id: idx,
        bg: TILE_COLORS[idx % TILE_COLORS.length]
      }));
    }

    function changeLesson() {
      resetGame();
    }

    function initBoard() {
      loadWordList();
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      board = [];

      for (let r = 0; r < BOARD_SIZE; r++) {
        board[r] = [];
        for (let c = 0; c < BOARD_SIZE; c++) {
          let word;
          do {
            word = currentWords[Math.floor(Math.random() * currentWords.length)];
          } while (
            (r >= 2 && board[r-1][c].id === word.id && board[r-2][c].id === word.id) ||
            (c >= 2 && board[r][c-1].id === word.id && board[r][c-2].id === word.id)
          );
          board[r][c] = { ...word };
        }
      }
      renderBoard();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const item = board[r][c];
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.style.backgroundColor = item ? item.bg : 'transparent';
          if (selectedTile && selectedTile.r === r && selectedTile.c === c) {
            tile.classList.add('selected');
          }
          if (item) {
            tile.innerHTML = `
              <div class="tile-hanzi">${item.hanzi}</div>
              <div class="tile-pinyin">${item.pinyin}</div>
            `;
            tile.onclick = () => handleTileClick(r, c);
          }
          boardEl.appendChild(tile);
        }
      }
    }

    async function handleTileClick(r, c) {
      if (isProcessing || timeLeft <= 0) return;

      if (!selectedTile) {
        selectedTile = { r, c };
        renderBoard();
        return;
      }

      const r1 = selectedTile.r, c1 = selectedTile.c;
      const isAdjacent = (Math.abs(r1 - r) + Math.abs(c1 - c)) === 1;

      if (isAdjacent) {
        isProcessing = true;
        swapTiles(r1, c1, r, c);
        selectedTile = null;
        renderBoard();

        const hasMatch = await processMatches();
        if (!hasMatch) {
          swapTiles(r1, c1, r, c);
          renderBoard();
        }
        isProcessing = false;
      } else {
        selectedTile = { r, c };
        renderBoard();
      }
    }

    function swapTiles(r1, c1, r2, c2) {
      const temp = board[r1][c1];
      board[r1][c1] = board[r2][c2];
      board[r2][c2] = temp;
    }

    function checkMatches() {
      let matched = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(false));
      let hasMatch = false;

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE - 2; c++) {
          let id = board[r][c]?.id;
          if (id !== undefined && id === board[r][c+1]?.id && id === board[r][c+2]?.id) {
            matched[r][c] = matched[r][c+1] = matched[r][c+2] = true;
            hasMatch = true;
          }
        }
      }

      for (let c = 0; c < BOARD_SIZE; c++) {
        for (let r = 0; r < BOARD_SIZE - 2; r++) {
          let id = board[r][c]?.id;
          if (id !== undefined && id === board[r+1][c]?.id && id === board[r+2][c]?.id) {
            matched[r][c] = matched[r+1][c] = matched[r+2][c] = true;
            hasMatch = true;
          }
        }
      }
      return { hasMatch, matched };
    }

    async function processMatches() {
      let { hasMatch, matched } = checkMatches();
      if (!hasMatch) return false;

      let totalMatchedCount = 0;
      let lastWord = null;

      while (hasMatch) {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (matched[r][c] && board[r][c]) {
              lastWord = board[r][c];
              board[r][c] = null;
              totalMatchedCount++;
            }
          }
        }

        if (lastWord) {
          document.getElementById('bannerHanzi').innerText = lastWord.hanzi;
          document.getElementById('bannerPinyin').innerText = lastWord.pinyin;
          document.getElementById('bannerMeaning').innerText = lastWord.meaning;
        }

        score += totalMatchedCount * 100;
        document.getElementById('score').innerText = score;

        renderBoard();
        await new Promise(res => setTimeout(res, 200));

        dropTiles();
        renderBoard();
        await new Promise(res => setTimeout(res, 200));

        const res = checkMatches();
        hasMatch = res.hasMatch;
        matched = res.matched;
      }
      return true;
    }

    function dropTiles() {
      for (let c = 0; c < BOARD_SIZE; c++) {
        let emptyRow = BOARD_SIZE - 1;
        for (let r = BOARD_SIZE - 1; r >= 0; r--) {
          if (board[r][c] !== null) {
            board[emptyRow][c] = board[r][c];
            if (emptyRow !== r) board[r][c] = null;
            emptyRow--;
          }
        }
        for (let r = emptyRow; r >= 0; r--) {
          const randWord = currentWords[Math.floor(Math.random() * currentWords.length)];
          board[r][c] = { ...randWord };
        }
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      document.getElementById('finalScore').innerText = `최종 점수: ${score}점`;
      document.getElementById('gameOverModal').classList.add('show');
    }

    function resetGame() {
      score = 0;
      timeLeft = 60;
      selectedTile = null;
      isProcessing = false;
      document.getElementById('score').innerText = '0';
      document.getElementById('timer').innerText = '60s';
      document.getElementById('gameOverModal').classList.remove('show');
      initBoard();
      startTimer();
    }

    window.onload = () => {
      initBoard();
      startTimer();
    };
  </script>
</body>
</html>
