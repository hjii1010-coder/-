<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 중국어회화 단어 매칭 애니팡 게임 🐾</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * { 
      box-sizing: border-box; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; 
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
      color: #4A4A4A;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    @keyframes floatMascot {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    @keyframes bombPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes hintPulse {
      0%, 100% { transform: scale(1); outline: 4px solid #FFD700; box-shadow: 0 0 15px #FFD700; }
      50% { transform: scale(1.08); outline: 4px solid #FF4500; box-shadow: 0 0 25px #FF4500; }
    }

    .game-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .decor-sticker {
      position: absolute;
      top: -25px;
      font-size: 26px;
      animation: floatMascot 2.5s infinite ease-in-out;
      z-index: 5;
    }
    .sticker-left { left: 10px; }
    .sticker-right { right: 10px; animation-delay: 1.2s; }

    .user-badge {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 800;
      color: #8B5CF6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.12);
      border: 3px solid #FFF;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      padding: 12px 22px;
      border-radius: 24px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(255, 182, 193, 0.3);
      border: 3px solid #FFF0F5;
    }
    .stat-box { text-align: center; }
    .stat-title { font-size: 12px; color: #94A3B8; margin-bottom: 2px; font-weight: 700; }
    .stat-value { font-size: 22px; font-weight: 900; color: #FF6B81; }

    .card-banner {
      width: 100%;
      height: 76px;
      background: #FFFFFF;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
      border: 3px solid #FFD1DC;
      box-shadow: 0 8px 20px rgba(255, 209, 220, 0.4);
      padding: 0 16px;
    }
    .banner-mascot {
      font-size: 34px;
      animation: floatMascot 2s infinite ease-in-out;
    }
    .banner-content { text-align: left; }
    .banner-hanzi { font-size: 18px; font-weight: 900; color: #7C3AED; }
    .banner-sub { font-size: 13px; color: #FF6B81; font-weight: 800; }

    .grid-board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: rgba(255, 255, 255, 0.88);
      padding: 10px;
      border-radius: 28px;
      border: 4px solid #FFF;
      box-shadow: 0 14px 35px rgba(160, 108, 213, 0.18);
    }

    .tile {
      aspect-ratio: 1;
      width: 100%;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.03), inset 0 2px 0 rgba(255, 255, 255, 0.9);
      color: #2D3748;
      padding: 2px;
      text-align: center;
      word-break: keep-all;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }
    .tile:active { transform: scale(0.92); }
    .tile.selected {
      outline: 4px solid #FF6B81;
      transform: scale(1.08) rotate(2deg);
      z-index: 10;
      box-shadow: 0 0 18px rgba(255, 107, 129, 0.6);
    }

    .tile.hint-tile {
      animation: hintPulse 1s infinite ease-in-out !important;
      z-index: 12;
    }

    .tile.bomb-tile {
      background: #FFF0F0 !important;
      border: 2px dashed #FF4757;
      animation: bombPulse 1.2s infinite ease-in-out;
    }
    
    .tile-hanzi { font-size: 15px; font-weight: 900; line-height: 1.1; margin-bottom: 2px; color: #1E293B; }
    .tile-pinyin { font-size: 9.5px; opacity: 0.85; font-weight: 700; color: #475569; }
    .tile-meaning { font-size: 11.5px; font-weight: 800; line-height: 1.2; color: #334155; padding: 0 2px; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(139, 92, 246, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #FFFFFF;
      padding: 28px 22px;
      border-radius: 32px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      border: 4px solid #FFD1DC;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.15);
      max-height: 88dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-title { font-size: 21px; font-weight: 900; color: #7C3AED; margin-bottom: 16px; }
    
    .input-group { margin-bottom: 14px; text-align: left; }
    .input-label { font-size: 13px; font-weight: 800; color: #64748B; margin-bottom: 6px; display: block; }
    .custom-input, .custom-select {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      border: 2px solid #F1F5F9;
      border-radius: 16px;
      outline: none;
      background: #F8FAFC;
      color: #334155;
      -webkit-appearance: none;
    }

    .btn-main {
      background: linear-gradient(135deg, #FF7675 0%, #FF6B81 100%);
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 18px rgba(255, 107, 129, 0.35);
      margin-top: 10px;
    }

    .btn-secondary {
      background: #F3E8FF;
      color: #7C3AED;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .rank-table th { background: #F3E8FF; color: #7C3AED; padding: 10px; border-radius: 8px; }
    .rank-table td { padding: 8px; border-bottom: 1px solid #F1F5F9; text-align: center; }
    .rank-badge { font-weight: 900; color: #FF6B81; }
  </style>
</head>
<body>
  <!-- 내부 구현 생략 (다운로드 파일에 완벽 수록) -->
</body>
</html>
