<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 중국어회화 애니팡 게임 🐾</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * { 
      box-sizing: border-box; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; 
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
      color: #4A4A4A;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .game-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .user-badge {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 800;
      color: #8B5CF6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border: 3px solid #FFF;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      padding: 12px 22px;
      border-radius: 24px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(255, 182, 193, 0.3);
      border: 3px solid #FFF0F5;
    }
    .stat-title { font-size: 12px; color: #94A3B8; margin-bottom: 2px; font-weight: 700; text-align: center; }
    .stat-value { font-size: 22px; font-weight: 900; color: #FF6B81; text-align: center; }

    .card-banner {
      width: 100%;
      height: 76px;
      background: #FFFFFF;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
      border: 3px solid #FFD1DC;
      padding: 0 16px;
    }
    .banner-mascot { font-size: 34px; }
    .banner-content { text-align: left; }
    .banner-hanzi { font-size: 18px; font-weight: 900; color: #7C3AED; }
    .banner-sub { font-size: 13px; color: #FF6B81; font-weight: 800; }

    .grid-board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: rgba(255, 255, 255, 0.88);
      padding: 10px;
      border-radius: 28px;
      border: 4px solid #FFF;
      box-shadow: 0 14px 35px rgba(160, 108, 213, 0.18);
    }

    .tile {
      aspect-ratio: 1;
      width: 100%;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.2s;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.9);
      color: #2D3748;
      padding: 2px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }
    .tile.selected {
      outline: 4px solid #FF6B81;
      transform: scale(1.08);
      z-index: 10;
    }
    
    .tile-hanzi { font-size: 15px; font-weight: 900; line-height: 1.1; color: #1E293B; }
    .tile-pinyin { font-size: 9.5px; opacity: 0.85; font-weight: 700; color: #475569; }
    .tile-meaning { font-size: 11.5px; font-weight: 800; line-height: 1.2; color: #334155; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(139, 92, 246, 0.3);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #FFFFFF;
      padding: 28px 22px;
      border-radius: 32px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      border: 4px solid #FFD1DC;
    }
    .modal-title { font-size: 21px; font-weight: 900; color: #7C3AED; margin-bottom: 16px; }
    .input-group { margin-bottom: 14px; text-align: left; }
    .input-label { font-size: 13px; font-weight: 800; color: #64748B; margin-bottom: 6px; display: block; }
    .custom-input, .custom-select {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      border: 2px solid #F1F5F9;
      border-radius: 16px;
      outline: none;
      background: #F8FAFC;
    }

    .btn-main {
      background: linear-gradient(135deg, #FF7675 0%, #FF6B81 100%);
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn-secondary {
      background: #F3E8FF;
      color: #7C3AED;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="user-badge">
      <span id="displayUserInfo">👤 학생 정보 미입력</span>
      <button onclick="openStartModal()" style="border:none; background:none; color:#7C3AED; font-weight:800; cursor:pointer;">⚙️ 변경</button>
    </div>

    <div class="header">
      <div>
        <div class="stat-title">⏰ 남은 시간</div>
        <div id="timer" class="stat-value">60s</div>
      </div>
      <div>
        <div class="stat-title">✨ 점수</div>
        <div id="score" class="stat-value">0</div>
      </div>
    </div>

    <div class="card-banner">
      <div class="banner-mascot" id="bannerMascot">🐥</div>
      <div class="banner-content">
        <div id="bannerHanzi" class="banner-hanzi">중국어 애니팡!</div>
        <div id="bannerSub" class="banner-sub">이웃한 카드를 교환해 3개를 이으세요!</div>
      </div>
    </div>

    <div id="board" class="grid-board"></div>
  </div>

  <!-- 시작 모달 -->
  <div id="startModal" class="modal show">
    <div class="modal-box">
      <div style="font-size: 44px; margin-bottom: 6px;">🐼</div>
      <div class="modal-title">중국어회화 애니팡</div>
      
      <div class="input-group">
        <label class="input-label">학번</label>
        <input type="text" id="studentId" class="custom-input" placeholder="예: 10101">
      </div>
      <div class="input-group">
        <label class="input-label">이름</label>
        <input type="text" id="studentName" class="custom-input" placeholder="이름 입력">
      </div>
      <div class="input-group">
        <label class="input-label">학습 단원 선택</label>
        <select id="lessonSelect" class="custom-select">
          <option value="1단원-회화1">📖 1단원 회화 1</option>
          <option value="1단원-회화2">📖 1단원 회화 2</option>
          <option value="2단원-회화1">📖 2단원 회화 1</option>
          <option value="2단원-회화2">📖 2단원 회화 2</option>
        </select>
      </div>

      <button class="btn-main" onclick="startGameWithUser()">게임 시작하기 🚀</button>
    </div>
  </div>

  <!-- 게임 종료 모달 -->
  <div id="gameOverModal" class="modal">
    <div class="modal-box">
      <div style="font-size: 52px; margin-bottom: 8px;">🎉</div>
      <div class="modal-title">게임 종료!</div>
      <div id="finalScore" style="font-size: 20px; font-weight: 900; color: #334155; margin-bottom: 16px;">0점</div>
      <button class="btn-main" onclick="resetGame()">다시 하기 🔄</button>
    </div>
  </div>

  <script>
    const LESSON_DATA = {
      "1단원-회화1": [
        { hanzi: "好久", pinyin: "hǎojiǔ", meaning: "오랫동안" },
        { hanzi: "不见", pinyin: "bújiàn", meaning: "만나지 않다" },
        { hanzi: "暑假", pinyin: "shǔjià", meaning: "여름 방학" },
        { hanzi: "过", pinyin: "guò", meaning: "지내다" },
        { hanzi: "看", pinyin: "kàn", meaning: "보다" },
        { hanzi: "书", pinyin: "shū", meaning: "책" }
      ],
      "1단원-회화2": [
        { hanzi: "同学", pinyin: "tóngxué", meaning: "학우" },
        { hanzi: "高兴", pinyin: "gāoxìng", meaning: "기쁘다" },
        { hanzi: "觉得", pinyin: "juéde", meaning: "느끼다" },
        { hanzi: "学习", pinyin: "xuéxí", meaning: "공부하다" },
        { hanzi: "加油", pinyin: "jiāyóu", meaning: "화이팅" }
      ],
      "2단원-회화1": [
        { hanzi: "参加", pinyin: "cānjiā", meaning: "참가하다" },
        { hanzi: "社团", pinyin: "shètuán", meaning: "동아리" },
        { hanzi: "电影", pinyin: "diànyǐng", meaning: "영화" },
        { hanzi: "音乐", pinyin: "yīnyuè", meaning: "음악" },
        { hanzi: "喜欢", pinyin: "xǐhuan", meaning: "좋아하다" }
      ],
      "2단원-회화2": [
        { hanzi: "欢迎", pinyin: "huānyíng", meaning: "환영하다" },
        { hanzi: "时间", pinyin: "shíjiān", meaning: "시간" },
        { hanzi: "联系", pinyin: "liánxì", meaning: "연락하다" },
        { hanzi: "加入", pinyin: "jiārù", meaning: "가입하다" },
        { hanzi: "精彩", pinyin: "jīngcǎi", meaning: "멋지다" }
      ]
    };

    const COLORS = ["#FCF4F4", "#FCF6F0", "#FCFBF0", "#F2FAF3", "#F2FAF8", "#F1F6FC"];
    const BOARD_SIZE = 6;
    
    let currentUser = { id: "", name: "", lesson: "" };
    let activeWords = [];
    let board = [];
    let selectedTile = null;
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let isProcessing = false;

    function startGameWithUser() {
      const id = document.getElementById('studentId').value.trim();
      const name = document.getElementById('studentName').value.trim();
      if (!id || !name) return alert('학번과 이름을 입력하세요!');

      currentUser = { id, name, lesson: document.getElementById('lessonSelect').value };
      document.getElementById('displayUserInfo').innerText = `👤 ${id} ${name}`;
      document.getElementById('startModal').classList.remove('show');
      resetGame();
    }

    function getRandomTileInstance() {
      const randWord = activeWords[Math.floor(Math.random() * activeWords.length)];
      const displayType = Math.random() < 0.5 ? 'hanzi' : 'meaning';
      return { ...randWord, displayType, bg: COLORS[randWord.id % COLORS.length] };
    }

    function initBoard() {
      const raw = LESSON_DATA[currentUser.lesson] || LESSON_DATA["1단원-회화1"];
      activeWords = raw.map((item, idx) => ({ ...item, id: idx }));

      board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));

      // 초기에 3개가 연속되지 않게 보드 세팅
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          let item;
          do {
            item = getRandomTileInstance();
          } while (
            (r >= 2 && board[r-1][c].id === item.id && board[r-2][c].id === item.id) ||
            (c >= 2 && board[r][c-1].id === item.id && board[r][c-2].id === item.id)
          );
          board[r][c] = item;
        }
      }
      renderBoard();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const item = board[r][c];
          const tile = document.createElement('div');
          tile.className = 'tile';
          if (item) {
            tile.style.backgroundColor = item.bg;
            tile.innerHTML = item.displayType === 'hanzi' 
              ? `<div class="tile-hanzi">${item.hanzi}</div><div class="tile-pinyin">${item.pinyin}</div>`
              : `<div class="tile-meaning">${item.meaning}</div>`;
            
            if (selectedTile && selectedTile.r === r && selectedTile.c === c) {
              tile.classList.add('selected');
            }
            tile.onclick = () => handleTileClick(r, c);
          }
          boardEl.appendChild(tile);
        }
      }
    }

    async function handleTileClick(r, c) {
      if (isProcessing || timeLeft <= 0) return;

      if (!selectedTile) {
        selectedTile = { r, c };
        renderBoard();
        return;
      }

      const r1 = selectedTile.r, c1 = selectedTile.c;
      const isAdjacent = (Math.abs(r1 - r) + Math.abs(c1 - c)) === 1;

      if (isAdjacent) {
        isProcessing = true;
        swapTiles(r1, c1, r, c);
        selectedTile = null;
        renderBoard();

        const matched = await processMatches();
        if (!matched) {
          // 매칭 실패 시 원위치
          swapTiles(r1, c1, r, c);
          renderBoard();
        }
        isProcessing = false;
      } else {
        selectedTile = { r, c };
        renderBoard();
      }
    }

    function swapTiles(r1, c1, r2, c2) {
      const temp = board[r1][c1];
      board[r1][c1] = board[r2][c2];
      board[r2][c2] = temp;
    }

    function checkMatches() {
      let matched = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(false));
      let hasMatch = false;

      // 가로 검사
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE - 2; c++) {
          let id = board[r][c]?.id;
          if (id !== undefined && id === board[r][c+1]?.id && id === board[r][c+2]?.id) {
            matched[r][c] = matched[r][c+1] = matched[r][c+2] = true;
            hasMatch = true;
          }
        }
      }

      // 세로 검사
      for (let c = 0; c < BOARD_SIZE; c++) {
        for (let r = 0; r < BOARD_SIZE - 2; r++) {
          let id = board[r][c]?.id;
          if (id !== undefined && id === board[r+1][c]?.id && id === board[r+2][c]?.id) {
            matched[r][c] = matched[r+1][c] = matched[r+2][c] = true;
            hasMatch = true;
          }
        }
      }
      return { hasMatch, matched };
    }

    async function processMatches() {
      let { hasMatch, matched } = checkMatches();
      if (!hasMatch) return false;

      while (hasMatch) {
        let count = 0;
        let matchedWord = null;

        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (matched[r][c] && board[r][c]) {
              matchedWord = board[r][c];
              board[r][c] = null;
              count++;
            }
          }
        }

        if (matchedWord) {
          document.getElementById('bannerHanzi').innerText = `${matchedWord.hanzi} (${matchedWord.pinyin})`;
          document.getElementById('bannerSub').innerText = `뜻: ${matchedWord.meaning}`;
        }

        score += count * 100;
        document.getElementById('score').innerText = score;

        renderBoard();
        await new Promise(res => setTimeout(res, 250));

        // 애니팡 중력 (블록 떨어뜨리기)
        dropTiles();
        renderBoard();
        await new Promise(res => setTimeout(res, 250));

        // 연쇄 반응 확인
        const res = checkMatches();
        hasMatch = res.hasMatch;
        matched = res.matched;
      }
      return true;
    }

    function dropTiles() {
      for (let c = 0; c < BOARD_SIZE; c++) {
        let emptyRow = BOARD_SIZE - 1;
        for (let r = BOARD_SIZE - 1; r >= 0; r--) {
          if (board[r][c] !== null) {
            board[emptyRow][c] = board[r][c];
            if (emptyRow !== r) board[r][c] = null;
            emptyRow--;
          }
        }
        // 빈 곳 채우기
        for (let r = emptyRow; r >= 0; r--) {
          board[r][c] = getRandomTileInstance();
        }
      }
    }

    function resetGame() {
      score = 0;
      timeLeft = 60;
      selectedTile = null;
      document.getElementById('score').innerText = '0';
      document.getElementById('timer').innerText = '60s';
      document.getElementById('gameOverModal').classList.remove('show');
      initBoard();
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('finalScore').innerText = `최종 점수: ${score}점`;
          document.getElementById('gameOverModal').classList.add('show');
        }
      }, 1000);
    }
  </script>
</body>
</html>
