<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 중국어회화 단어 애니팡 🐼</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: linear-gradient(135deg, #FFE5EC 0%, #F0E6FF 50%, #E8F5E9 100%);
      color: #4A4A4A;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .game-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 상단 학번/이름 표시 바 */
    .user-badge {
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      color: #7C3AED;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.08);
      border: 2px solid #F3E8FF;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      padding: 12px 20px;
      border-radius: 20px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(255, 182, 193, 0.2);
      border: 2px solid #FFF0F5;
    }
    .stat-box { text-align: center; }
    .stat-title { font-size: 12px; color: #8E8E93; margin-bottom: 2px; font-weight: 600; }
    .stat-value { font-size: 22px; font-weight: 800; color: #FF6B81; }

    /* 단어 표시 카드 */
    .card-banner {
      width: 100%;
      height: 70px;
      background: #FFFFFF;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      border: 3px solid #FFD1DC;
      box-shadow: 0 8px 20px rgba(255, 209, 220, 0.3);
      position: relative;
    }
    .banner-mascot { font-size: 28px; }
    .banner-content { text-align: left; }
    .banner-hanzi { font-size: 22px; font-weight: 800; color: #6C5CE7; }
    .banner-sub { font-size: 13px; color: #FF7675; font-weight: 700; }

    /* 게임 그리드 판 */
    .grid-board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px;
      border-radius: 24px;
      border: 3px solid #FFF;
      box-shadow: 0 12px 30px rgba(160, 108, 213, 0.15);
    }

    .tile {
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05), inset 0 -3px 0 rgba(0,0,0,0.1);
      color: #333333;
    }
    .tile:active { transform: scale(0.92); }
    .tile.selected {
      outline: 4px solid #FF6B81;
      transform: scale(1.08);
      z-index: 10;
      box-shadow: 0 0 18px rgba(255, 107, 129, 0.5);
    }
    .tile-hanzi { font-size: 15px; font-weight: 800; line-height: 1.1; margin-bottom: 2px; }
    .tile-pinyin { font-size: 9px; opacity: 0.85; font-weight: 600; }

    /* 모달 공통 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(108, 92, 231, 0.3);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #FFFFFF;
      padding: 28px 24px;
      border-radius: 28px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      border: 4px solid #FFD1DC;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title { font-size: 24px; font-weight: 800; color: #6C5CE7; margin-bottom: 16px; }
    
    /* 입력 폼 스타일 */
    .input-group { margin-bottom: 14px; text-align: left; }
    .input-label { font-size: 13px; font-weight: 700; color: #8E8E93; margin-bottom: 6px; display: block; }
    .custom-input, .custom-select {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
      border: 2px solid #E8E8E8;
      border-radius: 14px;
      outline: none;
      background: #FAFAFA;
      color: #4A4A4A;
      transition: border-color 0.2s;
    }
    .custom-input:focus, .custom-select:focus {
      border-color: #A29BFE;
      background: #FFF;
    }

    .btn-main {
      background: linear-gradient(135deg, #FF7675 0%, #FF6B81 100%);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 15px rgba(255, 107, 129, 0.3);
      margin-top: 8px;
    }
    .btn-main:active { transform: scale(0.97); }

    .btn-secondary {
      background: #F3E8FF;
      color: #7C3AED;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    /* 순위표 테이블 스타일 */
    .rank-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    .rank-table th { background: #F3E8FF; color: #7C3AED; padding: 8px; border-radius: 6px; }
    .rank-table td { padding: 8px; border-bottom: 1px solid #F0F0F0; text-align: center; }
    .rank-badge { font-weight: 800; color: #FF6B81; }
  </style>
</head>

    <div class="user-badge">
      <span id="displayUserInfo">👤 학생 정보 미입력</span>
      <button onclick="openStartModal()" style="border:none; background:none; color:#7C3AED; font-weight:700; cursor:pointer; font-size:12px;">⚙️ 변경</button>
    </div>

    <!-- 스코어 헤더 -->
    <div class="header">

        <div class="stat-title">⏰ 남은 시간</div>
        <div id="timer" class="stat-value">60s</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">✨ 점수</div>
        <div id="score" class="stat-value">0</div>
      </div>
    </div>

    <!-- 카드 배너 -->
    <div class="card-banner">
      <div class="banner-mascot" id="bannerMascot">🐼</div>
      <div class="banner-content">
        <div id="bannerHanzi" class="banner-hanzi">중국어 애니팡</div>
        <div id="bannerSub" class="banner-sub">3개를 연결해 단어를 맞춰보세요!</div>
      </div>
    </div>

    <!-- 퍼즐 판 -->
    <div id="board" class="grid-board"></div>
  </div>

      <div class="input-group">

        <input type="text" id="studentId" class="custom-input" placeholder="학번을 입력하세요">
      </div>

      <div class="input-group">
        <label class="input-label">이름</label>
        <input type="text" id="studentName" class="custom-input" placeholder="이름을 입력하세요">
      </div>

      <div class="input-group">
        <label class="input-label">학습 단원 선택</label>
        <select id="lessonSelect" class="custom-select">
          <option value="1단원-회화1">📖 1단원 회화 1</option>
          <option value="1단원-회화2">📖 1단원 회화 2</option>
          <option value="1단원-추가">➕ 1단원 추가 단어</option>
          <option value="2단원-회화1">📖 2단원 회화 1</option>
          <option value="2단원-회화2">📖 2단원 회화 2</option>
          <option value="2단원-추가">➕ 2단원 추가 단어</option>
          <option value="전체">📚 1~2단원 전체 통합</option>
        </select>
      </div>

      <button class="btn-main" onclick="startGameWithUser()">게임 시작하기 🚀</button>
      <button class="btn-secondary" onclick="openLeaderboard()">🏆 전체 순위표 보기 (교사용)</button>
    </div>
  </div>

  <!-- 2. 게임 종료 모달 -->
  <div id="gameOverModal" class="modal">
    <div class="modal-box">
      <div style="font-size: 48px; margin-bottom: 8px;">🎉</div>
      <div class="modal-title">수고하셨습니다!</div>
      <div id="finalScore" style="font-size: 20px; font-weight: 800; color: #4A4A4A; margin-bottom: 16px;">최종 점수: 0점</div>
      
      <button class="btn-main" onclick="resetGame()">다시 도전하기 🔄</button>
      <button class="btn-secondary" onclick="openLeaderboard()">🏆 전체 순위표 보기</button>
      <button class="btn-secondary" style="background:#F5F5F5; color:#666;" onclick="openStartModal()">👤 학생 정보 바꾸기</button>
    </div>
  </div>

          <tbody id="rankTableBody">

        </table>
      </div>
      <button class="btn-main" style="margin-top: 16px;" onclick="closeLeaderboard()">닫기</button>

    // 모달 제어
    function openStartModal() {

    function startGameWithUser() {
      const studentId = document.getElementById('studentId').value.trim();
      const studentName = document.getElementById('studentName').value.trim();
      const lesson = document.getElementById('lessonSelect').value;

        alert('학번과 이름을 모두 입력해주세요! 🌸');
        return;
      }

      currentUser = { id: studentId, name: studentName, lesson: lesson };
      document.getElementById('displayUserInfo').innerText = `👤 ${studentId} ${studentName} | ${lesson}`;
      document.getElementById('startModal').classList.remove('show');
      
      resetGame();
    }

    function loadWordList() {
      const selectedKey = currentUser.lesson || "1단원-회화1";
      let rawList = [];

      if (selectedKey === "전체") {
        Object.values(LESSON_DATA).forEach(list => rawList.push(...list));
      } else {
        rawList = LESSON_DATA[selectedKey] || [];
      }

      // 무작위 셔플
      let shuffled = [...rawList];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      const MAX_ACTIVE = Math.min(8, shuffled.length);
      const selectedWords = shuffled.slice(0, MAX_ACTIVE);

      currentWords = selectedWords.map((item, idx) => ({
        ...item,
        id: idx,
        bg: PASTEL_COLORS[idx % PASTEL_COLORS.length]
      }));
    }

    function initBoard() {
      loadWordList();
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      board = [];

      for (let r = 0; r < BOARD_SIZE; r++) {
        board[r] = [];
        for (let c = 0; c < BOARD_SIZE; c++) {
          let word;
          do {
            word = currentWords[Math.floor(Math.random() * currentWords.length)];
          } while (
            (r >= 2 && board[r-1][c].id === word.id && board[r-2][c].id === word.id) ||
            (c >= 2 && board[r][c-1].id === word.id && board[r][c-2].id === word.id)
          );
          board[r][c] = { ...word };
        }
      }
      renderBoard();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const item = board[r][c];
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.style.backgroundColor = item ? item.bg : 'transparent';
          if (selectedTile && selectedTile.r === r && selectedTile.c === c) {
            tile.classList.add('selected');
          }
          if (item) {
            tile.innerHTML = `
              <div class="tile-hanzi">${item.hanzi}</div>
              <div class="tile-pinyin">${item.pinyin}</div>
            `;
            tile.onclick = () => handleTileClick(r, c);
          }
          boardEl.appendChild(tile);
        }
      }
    }

    async function handleTileClick(r, c) {
      if (isProcessing || timeLeft <= 0) return;

      if (!selectedTile) {
        selectedTile = { r, c };
        renderBoard();
        return;
      }

      const r1 = selectedTile.r, c1 = selectedTile.c;
      const isAdjacent = (Math.abs(r1 - r) + Math.abs(c1 - c)) === 1;

      if (isAdjacent) {
        isProcessing = true;
        swapTiles(r1, c1, r, c);
        selectedTile = null;
        renderBoard();

        const hasMatch = await processMatches();
        if (!hasMatch) {
          swapTiles(r1, c1, r, c);
          renderBoard();
        }
        isProcessing = false;
      } else {
        selectedTile = { r, c };
        renderBoard();
      }
    }

    function swapTiles(r1, c1, r2, c2) {
      const temp = board[r1][c1];
      board[r1][c1] = board[r2][c2];
      board[r2][c2] = temp;
    }

    function checkMatches() {
      let matched = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(false));
      let hasMatch = false;

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE - 2; c++) {
          let id = board[r][c]?.id;
          if (id !== undefined && id === board[r][c+1]?.id && id === board[r][c+2]?.id) {
            matched[r][c] = matched[r][c+1] = matched[r][c+2] = true;
            hasMatch = true;
          }
        }
      }

      for (let c = 0; c < BOARD_SIZE; c++) {
        for (let r = 0; r < BOARD_SIZE - 2; r++) {
          let id = board[r][c]?.id;
          if (id !== undefined && id === board[r+1][c]?.id && id === board[r+2][c]?.id) {
            matched[r][c] = matched[r+1][c] = matched[r+2][c] = true;
            hasMatch = true;
          }
        }
      }
      return { hasMatch, matched };
    }

    async function processMatches() {
      let { hasMatch, matched } = checkMatches();
      if (!hasMatch) return false;

      let totalMatchedCount = 0;
      let lastWord = null;

      while (hasMatch) {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (matched[r][c] && board[r][c]) {
              lastWord = board[r][c];
              board[r][c] = null;
              totalMatchedCount++;
            }
          }
        }

        if (lastWord) {
          document.getElementById('bannerHanzi').innerText = `${lastWord.hanzi} (${lastWord.pinyin})`;
          document.getElementById('bannerSub').innerText = `뜻: ${lastWord.meaning}`;
          document.getElementById('bannerMascot').innerText = MASCOTS[Math.floor(Math.random() * MASCOTS.length)];
        }

        score += totalMatchedCount * 100;
        document.getElementById('score').innerText = score;

        renderBoard();
        await new Promise(res => setTimeout(res, 200));

        dropTiles();
        renderBoard();
        await new Promise(res => setTimeout(res, 200));

        const res = checkMatches();
        hasMatch = res.hasMatch;
        matched = res.matched;
      }
      return true;
    }

    function dropTiles() {
      for (let c = 0; c < BOARD_SIZE; c++) {
        let emptyRow = BOARD_SIZE - 1;
        for (let r = BOARD_SIZE - 1; r >= 0; r--) {
          if (board[r][c] !== null) {
            board[emptyRow][c] = board[r][c];
            if (emptyRow !== r) board[r][c] = null;
            emptyRow--;
          }
        }
        for (let r = emptyRow; r >= 0; r--) {
          const randWord = currentWords[Math.floor(Math.random() * currentWords.length)];
          board[r][c] = { ...randWord };
        }
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      saveScore(currentUser.id, currentUser.name, currentUser.lesson, score);
      document.getElementById('finalScore').innerText = `최종 점수: ${score}점`;
      document.getElementById('gameOverModal').classList.add('show');
    }

    function resetGame() {
      score = 0;
      timeLeft = 60;
      selectedTile = null;
      isProcessing = false;
      document.getElementById('score').innerText = '0';
      document.getElementById('timer').innerText = '60s';
      document.getElementById('gameOverModal').classList.remove('show');
      initBoard();
      startTimer();
    }

    // --- 점수 저장 및 순위표 (localStorage 기반) ---
    function saveScore(id, name, lesson, score) {
      if (!id || !name) return;
      let scores = JSON.parse(localStorage.getItem('chineseGameScores') || "[]");
      scores.push({
        id: id,
        name: name,
        lesson: lesson,
        score: score,
        date: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      });
      // 점수 높은 순으로 정렬
      scores.sort((a, b) => b.score - a.score);
      localStorage.setItem('chineseGameScores', JSON.stringify(scores));
    }

    function openLeaderboard() {
      const scores = JSON.parse(localStorage.getItem('chineseGameScores') || "[]");
      const tbody = document.getElementById('rankTableBody');
      tbody.innerHTML = '';

      if (scores.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#999; padding:16px;">등록된 기록이 없습니다.</td></tr>`;
      } else {
        scores.forEach((item, index) => {
          let rankMedal = index + 1;
          if (index === 0) rankMedal = "🥇 1";
          else if (index === 1) rankMedal = "🥈 2";
          else if (index === 2) rankMedal = "🥉 3";

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="rank-badge">${rankMedal}</td>
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.lesson}</td>
            <td style="font-weight:800; color:#FF6B81;">${item.score}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('leaderboardModal').classList.add('show');
    }

    function closeLeaderboard() {
      document.getElementById('leaderboardModal').classList.remove('show');
    }

    function clearLeaderboard() {
      if (confirm('모든 학생의 점수 기록을 초기화하시겠습니까?')) {
        localStorage.removeItem('chineseGameScores');
        openLeaderboard();
      }
    }
  </script>
