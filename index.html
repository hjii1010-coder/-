<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 중국어회화 단어 매칭 애니팡 게임 🐾</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * { 
      box-sizing: border-box; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; 
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
      color: #4A4A4A;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    @keyframes floatMascot {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    @keyframes bombPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes hintPulse {
      0%, 100% { transform: scale(1); outline: 4px solid #FFD700; box-shadow: 0 0 15px #FFD700; }
      50% { transform: scale(1.08); outline: 4px solid #FF4500; box-shadow: 0 0 25px #FF4500; }
    }

    .game-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .decor-sticker {
      position: absolute;
      top: -25px;
      font-size: 26px;
      animation: floatMascot 2.5s infinite ease-in-out;
      z-index: 5;
    }
    .sticker-left { left: 10px; }
    .sticker-right { right: 10px; animation-delay: 1.2s; }

    .user-badge {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 800;
      color: #8B5CF6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.12);
      border: 3px solid #FFF;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      padding: 12px 22px;
      border-radius: 24px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(255, 182, 193, 0.3);
      border: 3px solid #FFF0F5;
    }
    .stat-box { text-align: center; }
    .stat-title { font-size: 12px; color: #94A3B8; margin-bottom: 2px; font-weight: 700; }
    .stat-value { font-size: 22px; font-weight: 900; color: #FF6B81; }

    .card-banner {
      width: 100%;
      height: 76px;
      background: #FFFFFF;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
      border: 3px solid #FFD1DC;
      box-shadow: 0 8px 20px rgba(255, 209, 220, 0.4);
      padding: 0 16px;
    }
    .banner-mascot {
      font-size: 34px;
      animation: floatMascot 2s infinite ease-in-out;
    }
    .banner-content { text-align: left; }
    .banner-hanzi { font-size: 18px; font-weight: 900; color: #7C3AED; }
    .banner-sub { font-size: 13px; color: #FF6B81; font-weight: 800; }

    .grid-board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: rgba(255, 255, 255, 0.88);
      padding: 10px;
      border-radius: 28px;
      border: 4px solid #FFF;
      box-shadow: 0 14px 35px rgba(160, 108, 213, 0.18);
    }

    .tile {
      aspect-ratio: 1;
      width: 100%;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.03), inset 0 2px 0 rgba(255, 255, 255, 0.9);
      color: #2D3748;
      padding: 2px;
      text-align: center;
      word-break: keep-all;
      position: relative;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
    .tile:active {
      transform: scale(0.92);
    }
    .tile.selected {
      outline: 4px solid #FF6B81;
      transform: scale(1.08) rotate(2deg);
      z-index: 10;
      box-shadow: 0 0 18px rgba(255, 107, 129, 0.6);
    }

    .tile.hint-tile {
      animation: hintPulse 1s infinite ease-in-out !important;
      z-index: 12;
    }

    .tile.bomb-tile {
      background: #FFF0F0 !important;
      border: 2px dashed #FF4757;
      animation: bombPulse 1.2s infinite ease-in-out;
    }
    
    .tile-hanzi { font-size: 15px; font-weight: 900; line-height: 1.1; margin-bottom: 2px; color: #1E293B; }
    .tile-pinyin { font-size: 9.5px; opacity: 0.85; font-weight: 700; color: #475569; }
    .tile-meaning { font-size: 11.5px; font-weight: 800; line-height: 1.2; color: #334155; padding: 0 2px; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(139, 92, 246, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #FFFFFF;
      padding: 28px 22px;
      border-radius: 32px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      border: 4px solid #FFD1DC;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.15);
      max-height: 88dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-title { font-size: 21px; font-weight: 900; color: #7C3AED; margin-bottom: 16px; }
    
    .input-group { margin-bottom: 14px; text-align: left; }
    .input-label { font-size: 13px; font-weight: 800; color: #64748B; margin-bottom: 6px; display: block; }
    .custom-input, .custom-select {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      border: 2px solid #F1F5F9;
      border-radius: 16px;
      outline: none;
      background: #F8FAFC;
      color: #334155;
      -webkit-appearance: none;
    }

    .btn-main {
      background: linear-gradient(135deg, #FF7675 0%, #FF6B81 100%);
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 18px rgba(255, 107, 129, 0.35);
      margin-top: 10px;
    }

    .btn-secondary {
      background: #F3E8FF;
      color: #7C3AED;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .rank-table th { background: #F3E8FF; color: #7C3AED; padding: 10px; border-radius: 8px; }
    .rank-table td { padding: 8px; border-bottom: 1px solid #F1F5F9; text-align: center; }
    .rank-badge { font-weight: 900; color: #FF6B81; }
  </style>
</head>

    </div>

    <div class="header">

        <div id="timer" class="stat-value">100s</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">✨ 점수</div>
        <div id="score" class="stat-value">0</div>
      </div>
    </div>

    <div class="card-banner">
      <div class="banner-mascot" id="bannerMascot">🐻‍❄️</div>
      <div class="banner-content">
        <div id="bannerHanzi" class="banner-hanzi">중국어회화 단어 매칭</div>
        <div id="bannerSub" class="banner-sub">한자와 뜻을 연결해 3개를 매칭하세요!</div>
      </div>
    </div>

    <div id="board" class="grid-board"></div>
  </div>

  <!-- 시작 모달 -->
  <div id="startModal" class="modal show">
    <div class="modal-box">
      <div style="font-size: 44px; margin-bottom: 6px; animation: floatMascot 2s infinite ease-in-out;">🐥</div>
      <div class="modal-title">중국어회화 단어 매칭 애니팡 게임</div>
      
      <div class="input-group">
        <label class="input-label">학번 (예: 10101)</label>
        <input type="text" id="studentId" class="custom-input" placeholder="학번을 입력하세요" autocomplete="off">
      </div>

      <div class="input-group">
        <label class="input-label">이름</label>
        <input type="text" id="studentName" class="custom-input" placeholder="이름을 입력하세요" autocomplete="off">
      </div>

      <div class="input-group">
        <label class="input-label">학습 단원 선택</label>
        <select id="lessonSelect" class="custom-select">
          <option value="1단원-회화1">📖 1단원 회화 1</option>
          <option value="1단원-회화2">📖 1단원 회화 2</option>
          <option value="1단원-추가">➕ 1단원 추가 단어</option>
          <option value="2단원-회화1">📖 2단원 회화 1</option>
          <option value="2단원-회화2">📖 2단원 회화 2</option>
          <option value="2단원-추가">➕ 2단원 추가 단어</option>
          <option value="전체">📚 1~2단원 전체 통합</option>
        </select>
      </div>

      <button class="btn-main" onclick="startGameWithUser()">게임 시작하기 🚀</button>
      <button class="btn-secondary" onclick="openLeaderboard()">🏆 전체 순위표 보기 (교사용)</button>
    </div>
  </div>

  <!-- 게임 종료 모달 -->
  <div id="gameOverModal" class="modal">
    <div class="modal-box">
      <div style="font-size: 52px; margin-bottom: 8px;">🎉</div>
      <div class="modal-title">참 잘했어요!</div>
      <div id="finalScore" style="font-size: 20px; font-weight: 900; color: #334155; margin-bottom: 16px;">최종 점수: 0점</div>
      
      <button class="btn-main" onclick="resetGame()">다시 도전하기 🔄</button>
      <button class="btn-secondary" onclick="openLeaderboard()">🏆 전체 순위표 보기</button>
      <button class="btn-secondary" style="background:#F1F5F9; color:#64748B;" onclick="openStartModal()">👤 학생 정보 바꾸기</button>
    </div>
  </div>

  <!-- 순위표 모달 -->
  <div id="leaderboardModal" class="modal">
    <div class="modal-box">
      <div class="modal-title">🏆 학생 점수 순위표</div>
      <div style="max-height: 250px; overflow-y: auto; -webkit-overflow-scrolling: touch;">
        <table class="rank-table">
          <thead>
            <tr>
              <th>순위</th>
              <th>학번</th>
              <th>이름</th>
              <th>단원</th>
              <th>점수</th>
            </tr>
          </thead>
          <tbody id="rankTableBody"></tbody>
        </table>
      </div>
      <button class="btn-main" style="margin-top: 16px;" onclick="closeLeaderboard()">닫기</button>
      <button class="btn-secondary" style="color: #FF6B81; background: #FFF0F5;" onclick="clearLeaderboard()">🧹 순위 기록 초기화 (교사 전용)</button>

    let selectedTile = null;
    let score = 0;
    let timeLeft = 100;
    let timerInterval = null;
    let isProcessing = false;
    
    let idleSeconds = 0;
    let hintPairs = null;
    let spawnBuffer = [];

    // 명도 92% 고정 파스텔톤 색상 생성기 (색상 시각 의존도 낮춤)
    function getPastelColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 50%, 92%)`;
    }

    function openStartModal() {
      document.getElementById('startModal').classList.add('show');
    }

    function startGameWithUser() {
      const studentId = document.getElementById('studentId').value.trim();
      const studentName = document.getElementById('studentName').value.trim();
      const lesson = document.getElementById('lessonSelect').value;

      if (!studentId || !studentName) {
        alert('학번과 이름을 입력해 주세요! 🌸');
        return;
      }

      currentUser = { id: studentId, name: studentName, lesson: lesson };
      document.getElementById('displayUserInfo').innerText = `👤 ${studentId} ${studentName} | ${lesson}`;
      document.getElementById('startModal').classList.remove('show');
      
      resetGame();
    }

    function loadWordList() {
      const selectedKey = currentUser.lesson || "1단원-회화1";
      let rawList = [];

      if (selectedKey === "전체") {
        Object.values(LESSON_DATA).forEach(list => rawList.push(...list));
      } else {
        rawList = LESSON_DATA[selectedKey] || [];
      }

      // 무작위로 단어 순서 섞기
      activeLessonWords = rawList.map((item, idx) => ({
        ...item,
        id: idx,
        bg: getPastelColor() // 각 단어마다 명도 92%의 파스텔톤 부여
      }));

      activeLessonWords.sort(() => Math.random() - 0.5);
    }

    // 3장 1세트로 단어 카드 생성
    function generateThreePack() {
      if (activeLessonWords.length === 0) return [];
      
      const randWord = activeLessonWords[Math.floor(Math.random() * activeLessonWords.length)];
      const pack = [];

      for (let i = 0; i < 3; i++) {
        const displayType = Math.random() < 0.5 ? 'hanzi' : 'meaning';
        pack.push({
          ...randWord,
          displayType,
          isBomb: false
        });
      }
      return pack;
    }

    // 보드 타일 신규 리필용 객체 가져오기
    function getNextTileInstance() {
      // 5% 확률로 폭탄 생성
      if (Math.random() < 0.05) {
        return { isBomb: true, id: -999, bg: '#FFF0F0' };
      }

      if (spawnBuffer.length === 0) {
        spawnBuffer = generateThreePack();
      }
      return spawnBuffer.pop();
    }

    function initBoard() {
      loadWordList();
      spawnBuffer = [];

      let validBoardCreated = false;
      let attempts = 0;

      while (!validBoardCreated && attempts < 200) {
        attempts++;
        // 6x6=36개 타일 -> 반드시 12세트(36개)의 단어 세트 구성
        let initialDeck = [];
        for (let i = 0; i < 12; i++) {
          initialDeck.push(...generateThreePack());
        }
        
        // 덱 섞기
        initialDeck.sort(() => Math.random() - 0.5);

        // 보드 배치
        board = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
          board[r] = [];
          for (let c = 0; c < BOARD_SIZE; c++) {
            board[r][c] = initialDeck[r * BOARD_SIZE + c];
          }
        }

        // 초기 시작 시 자동 터짐이 없고, 움직일 수 있는 매칭 조합이 존재하는지 확인
        if (!checkMatches().hasMatch && hasValidMove()) {
          validBoardCreated = true;
        }
      }

      clearHint();
      renderBoard();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const item = board[r][c];
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.style.backgroundColor = item ? item.bg : 'transparent';
          
          if (selectedTile && selectedTile.r === r && selectedTile.c === c) {
            tile.classList.add('selected');
          }

          if (hintPairs && hintPairs.some(p => p.r === r && p.c === c)) {
            tile.classList.add('hint-tile');
          }
          
          if (item) {
            if (item.isBomb) {
              tile.classList.add('bomb-tile');
              tile.innerHTML = `
                <div class="tile-hanzi" style="font-size:20px;">💣</div>
                <div class="tile-pinyin" style="color:#FF4757; font-weight:900;">폭탄</div>
              `;
            } else if (item.displayType === 'hanzi') {
              tile.innerHTML = `
                <div class="tile-hanzi">${item.hanzi}</div>
                <div class="tile-pinyin">${item.pinyin}</div>
              `;
            } else {
              tile.innerHTML = `
                <div class="tile-meaning">${item.meaning}</div>
              `;
            }
            tile.onclick = () => handleTileClick(r, c);
          }
          boardEl.appendChild(tile);
        }
      }
    }

    function clearHint() {
      idleSeconds = 0;
      hintPairs = null;
    }

    // 움직일 수 있는 조합이 있는지 감지
    function hasValidMove() {
      // 보드 상에 폭탄이 있는 경우 감지
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] && board[r][c].isBomb) return true;
        }
      }

      // 인접 타일 스왑을 통한 3개 연속 매칭 가능 여부 검사
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (c < BOARD_SIZE - 1) {
            swapTiles(r, c, r, c + 1);
            const matched = checkMatches().hasMatch;
            swapTiles(r, c, r, c + 1);
            if (matched) return true;
          }
          if (r < BOARD_SIZE - 1) {
            swapTiles(r, c, r + 1, c);
            const matched = checkMatches().hasMatch;
            swapTiles(r, c, r + 1, c);
            if (matched) return true;
          }
        }
      }
      return false;
    }

    // 더 이상 매칭 가능한 조합이 없을 때 자동 섞기
    function checkAndAutoShuffle() {
      if (hasValidMove()) return;

      document.getElementById('bannerHanzi').innerText = "🔀 자동 섞기!";
      document.getElementById('bannerSub').innerText = "매칭할 단어가 없어 카드를 다시 섞습니다!";
      document.getElementById('bannerMascot').innerText = "🎲";

      let shuffleAttempts = 0;
      while (!hasValidMove() && shuffleAttempts < 100) {
        shuffleAttempts++;
        let flatBoard = board.flat();
        
        // Fisher-Yates 섞기
        for (let i = flatBoard.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [flatBoard[i], flatBoard[j]] = [flatBoard[j], flatBoard[i]];
        }

        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            board[r][c] = flatBoard[r * BOARD_SIZE + c];
          }
        }

        // 섞은 결과가 즉시 완성되는 경우 방지
        if (checkMatches().hasMatch) {
          continue;
        }
      }
      renderBoard();
    }

    function findAndShowHint() {
      if (hintPairs || isProcessing) return;

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (c < BOARD_SIZE - 1) {
            swapTiles(r, c, r, c + 1);
            if (checkMatches().hasMatch) {
              swapTiles(r, c, r, c + 1);
              hintPairs = [{r, c}, {r, c: c + 1}];
              document.getElementById('bannerHanzi').innerText = "💡 힌트 전달!";
              document.getElementById('bannerSub').innerText = "반짝이는 두 카드의 위치를 바꿔보세요!";
              document.getElementById('bannerMascot').innerText = "✨";
              renderBoard();
              return;
            }
            swapTiles(r, c, r, c + 1);
          }

          if (r < BOARD_SIZE - 1) {
            swapTiles(r, c, r + 1, c);
            if (checkMatches().hasMatch) {
              swapTiles(r, c, r + 1, c);
              hintPairs = [{r, c}, {r: r + 1, c}];
              document.getElementById('bannerHanzi').innerText = "💡 힌트 전달!";
              document.getElementById('bannerSub').innerText = "반짝이는 두 카드의 위치를 바꿔보세요!";
              document.getElementById('bannerMascot').innerText = "✨";
              renderBoard();
              return;
            }
            swapTiles(r, c, r + 1, c);
          }
        }
      }
    }

    async function handleTileClick(r, c) {
      if (isProcessing || timeLeft <= 0) return;

      clearHint();
      const clickedItem = board[r][c];

      if (clickedItem && clickedItem.isBomb) {
        await triggerBombExplosion(r, c);
        return;
      }

      if (!selectedTile) {
        selectedTile = { r, c };
        renderBoard();
        return;
      }

      const r1 = selectedTile.r, c1 = selectedTile.c;
      const isAdjacent = (Math.abs(r1 - r) + Math.abs(c1 - c)) === 1;

      if (isAdjacent) {
        isProcessing = true;
        swapTiles(r1, c1, r, c);
        selectedTile = null;
        renderBoard();

        const hasMatch = await processMatches();
        if (!hasMatch) {
          swapTiles(r1, c1, r, c);
          renderBoard();
        } else {
          checkAndAutoShuffle();
        }
        isProcessing = false;
      } else {
        selectedTile = { r, c };
        renderBoard();
      }
    }

    async function triggerBombExplosion(centerR, centerC) {
      isProcessing = true;
      selectedTile = null;

      let clearedCount = 0;
      for (let r = Math.max(0, centerR - 1); r <= Math.min(BOARD_SIZE - 1, centerR + 1); r++) {
        for (let c = Math.max(0, centerC - 1); c <= Math.min(BOARD_SIZE - 1, centerC + 1); c++) {
          if (board[r][c]) {
            board[r][c] = null;
            clearedCount++;
          }
        }
      }

      score += clearedCount * 150;
      document.getElementById('score').innerText = score;

      document.getElementById('bannerHanzi').innerText = "💥 폭탄 팡!";
      document.getElementById('bannerSub').innerText = `주위 ${clearedCount}개 단어가 사라졌습니다!`;
      document.getElementById('bannerMascot').innerText = "💣";

      renderBoard();
      await new Promise(res => setTimeout(res, 300));

      dropTiles();
      renderBoard();
      await new Promise(res => setTimeout(res, 200));

      await processMatches();
      checkAndAutoShuffle();
      isProcessing = false;
    }

    function swapTiles(r1, c1, r2, c2) {
      const temp = board[r1][c1];
      board[r1][c1] = board[r2][c2];
      board[r2][c2] = temp;
    }

    function checkMatches() {
      let matched = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(false));
      let hasMatch = false;

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE - 2; c++) {
          let id = board[r][c]?.id;
          if (id !== undefined && id !== -999 && id === board[r][c+1]?.id && id === board[r][c+2]?.id) {
            matched[r][c] = matched[r][c+1] = matched[r][c+2] = true;
            hasMatch = true;
          }
        }
      }

      for (let c = 0; c < BOARD_SIZE; c++) {
        for (let r = 0; r < BOARD_SIZE - 2; r++) {
          let id = board[r][c]?.id;
          if (id !== undefined && id !== -999 && id === board[r+1][c]?.id && id === board[r+2][c]?.id) {
            matched[r][c] = matched[r+1][c] = matched[r+2][c] = true;
            hasMatch = true;
          }
        }
      }
      return { hasMatch, matched };
    }

    async function processMatches() {
      let { hasMatch, matched } = checkMatches();
      if (!hasMatch) return false;

      clearHint();
      let totalMatchedCount = 0;
      let lastWord = null;

      while (hasMatch) {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (matched[r][c] && board[r][c]) {
              lastWord = board[r][c];
              board[r][c] = null;
              totalMatchedCount++;
            }
          }
        }

        if (lastWord) {
          document.getElementById('bannerHanzi').innerText = `${lastWord.hanzi} (${lastWord.pinyin})`;
          document.getElementById('bannerSub').innerText = `뜻: ${lastWord.meaning}`;
          document.getElementById('bannerMascot').innerText = MASCOTS[Math.floor(Math.random() * MASCOTS.length)];
        }

        score += totalMatchedCount * 100;
        document.getElementById('score').innerText = score;

        renderBoard();
        await new Promise(res => setTimeout(res, 200));

        dropTiles();
        renderBoard();
        await new Promise(res => setTimeout(res, 200));

        const res = checkMatches();
        hasMatch = res.hasMatch;
        matched = res.matched;
      }
      return true;
    }

    function dropTiles() {
      for (let c = 0; c < BOARD_SIZE; c++) {
        let emptyRow = BOARD_SIZE - 1;
        for (let r = BOARD_SIZE - 1; r >= 0; r--) {
          if (board[r][c] !== null) {
            board[emptyRow][c] = board[r][c];
            if (emptyRow !== r) board[r][c] = null;
            emptyRow--;
          }
        }
        for (let r = emptyRow; r >= 0; r--) {
          board[r][c] = getNextTileInstance();
        }
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        idleSeconds++;
        document.getElementById('timer').innerText = `${timeLeft}s`;

        if (idleSeconds >= 15) {
          findAndShowHint();
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      saveScore(currentUser.id, currentUser.name, currentUser.lesson, score);
      document.getElementById('finalScore').innerText = `최종 점수: ${score}점`;
      document.getElementById('gameOverModal').classList.add('show');
    }

    function resetGame() {
      score = 0;
      timeLeft = 100;
      selectedTile = null;
      isProcessing = false;
      clearHint();
      document.getElementById('score').innerText = '0';
      document.getElementById('timer').innerText = '100s';
      document.getElementById('gameOverModal').classList.remove('show');
      initBoard();
      startTimer();
    }

    function saveScore(id, name, lesson, score) {
      if (!id || !name) return;
      try {
        let scores = JSON.parse(localStorage.getItem('chineseGameScores') || "[]");
        scores.push({
          id: id,
          name: name,
          lesson: lesson,
          score: score,
          date: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
        });
        scores.sort((a, b) => b.score - a.score);
        localStorage.setItem('chineseGameScores', JSON.stringify(scores));
      } catch(e) {
        console.warn("LocalStorage 접근 실패", e);
      }
    }

    function openLeaderboard() {
      let scores = [];
      try {
        scores = JSON.parse(localStorage.getItem('chineseGameScores') || "[]");
      } catch(e) {}
      
      const tbody = document.getElementById('rankTableBody');
      tbody.innerHTML = '';

      if (scores.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#94A3B8; padding:16px;">등록된 기록이 없습니다.</td></tr>`;
      } else {
        scores.forEach((item, index) => {
          let rankMedal = index + 1;
          if (index === 0) rankMedal = "🥇 1";
          else if (index === 1) rankMedal = "🥈 2";
          else if (index === 2) rankMedal = "🥉 3";

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="rank-badge">${rankMedal}</td>
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.lesson}</td>
            <td style="font-weight:900; color:#FF6B81;">${item.score}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('leaderboardModal').classList.add('show');
    }

    function closeLeaderboard() {
      document.getElementById('leaderboardModal').classList.remove('show');
    }

    function clearLeaderboard() {
      if (confirm('모든 학생의 점수 기록을 초기화하시겠습니까?')) {
        try {
          localStorage.removeItem('chineseGameScores');
        } catch(e) {}
        openLeaderboard();
      }
    }
  </script>
